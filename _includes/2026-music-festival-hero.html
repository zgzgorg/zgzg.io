<style>
  .mf-home-strip {
    background: linear-gradient(180deg, #4a5568 0%, #2f3640 55%, #262d36 100%);
    color: #fff;
  }

  .mf-home-kicker {
    letter-spacing: 0.3em;
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.7);
    text-transform: uppercase;
  }

  .mf-home-title {
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 0.2em;
    color: #fff;
    margin: 0.6rem 0 0.2rem;
  }

  .mf-home-subtitle {
    font-size: 1.2rem;
    letter-spacing: 0.5em;
    color: #c9a962;
    margin-bottom: 1.2rem;
  }

  .mf-home-facts {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin: 1.4rem 0 1.6rem;
  }

  .mf-home-fact {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(201, 169, 98, 0.45);
    border-radius: 12px;
    padding: 0.55rem 1.1rem;
  }

  .mf-home-fact-label {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: #c9a962;
  }

  .mf-home-fact-value {
    font-size: 1.05rem;
    font-weight: 700;
    color: #fff;
  }

  .mf-home-cta {
    display: inline-block;
    background: #c9a962;
    color: #262d36;
    font-weight: 700;
    border-radius: 999px;
    padding: 0.7rem 1.8rem;
    text-decoration: none;
  }

  .mf-home-ctas {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .mf-home-cta-ghost {
    background: transparent;
    color: #c9a962;
    border: 1px solid #c9a962;
  }

  .mf-home-cta-ghost:hover {
    background: rgba(201, 169, 98, 0.12);
    color: #e0c27a;
  }

  /* 海报卡片可以翻面：正面是海报，背面是 Eventbrite 官方购票窗口 */
  .mf-flip {
    max-width: 420px;
    margin: 0 auto;
    perspective: 1600px;
  }

  .mf-flip-inner {
    display: grid;
    transition: transform 0.7s ease;
    transform-style: preserve-3d;
  }

  .mf-flip.is-flipped .mf-flip-inner {
    transform: rotateY(180deg);
  }

  /* 两面叠在同一个格子里，卡片高度取两面中较高的一面 */
  .mf-flip-face {
    grid-area: 1 / 1;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .mf-flip-back {
    transform: rotateY(180deg);
    background: #fff;
    color: #2f3640;
    border-radius: 16px;
    padding: 1.1rem;
    text-align: left;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
  }

  .mf-flip.is-flipped .mf-flip-front,
  .mf-flip:not(.is-flipped) .mf-flip-back {
    pointer-events: none;
  }

  .mf-tickets-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.6rem;
  }

  .mf-home-tickets-title {
    font-size: 1.2rem;
    font-weight: 800;
    color: #2f3640;
    margin: 0;
  }

  .mf-flip-back-btn {
    background: none;
    border: 1px solid #c9a962;
    color: #8a7343;
    border-radius: 999px;
    padding: 0.2rem 0.8rem;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .mf-home-tickets-fallback {
    font-size: 0.8rem;
    color: #6b7280;
    margin: 0.6rem 0 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .mf-flip-inner {
      transition: none;
    }
  }

  .mf-home-cta:hover {
    background: #e0c27a;
    color: #262d36;
  }

  /* 海报按原始比例完整显示 */
  .mf-home-poster {
    width: 100%;
    max-width: 420px;
    height: auto;
    border-radius: 16px;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
  }

  /* 手机：海报做成顶部横幅，文字居中，两项信息并排 */
  @media (max-width: 767.98px) {
    .mf-home-strip > .container {
      padding: 0 0 2rem !important;
    }

    .mf-home-strip .row {
      margin: 0;
    }

    .mf-home-text {
      order: 2;
      padding: 0 1.25rem;
      text-align: center;
    }

    .mf-home-poster-col {
      order: 1;
      padding: 1.5rem 1.25rem 0.5rem;
    }

    .mf-home-poster {
      border-radius: 12px;
    }

    .mf-home-kicker {
      letter-spacing: 0.18em;
      font-size: 0.75rem;
    }

    .mf-home-kicker-extra {
      display: none;
    }

    .mf-home-title {
      font-size: 2.4rem;
      letter-spacing: 0.15em;
      margin-top: 0.4rem;
    }

    .mf-home-subtitle {
      font-size: 1rem;
      letter-spacing: 0.35em;
      margin-bottom: 0.9rem;
    }

    .mf-home-desc {
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .mf-home-facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin: 1.1rem 0 1.3rem;
    }

    .mf-home-fact {
      padding: 0.55rem 0.6rem;
    }

    .mf-home-fact-value {
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .mf-home-ctas {
      flex-direction: column;
    }

    .mf-home-cta {
      display: block;
      text-align: center;
    }
  }
</style>

<div class="strip mf-home-strip">
  <div class="container pt-5 pb-5">
    <div class="row align-items-center g-4">
      <div class="col-md-7 mf-home-text">
        <div class="mf-home-kicker">ZGZG Music Festival 2026<span class="mf-home-kicker-extra"> · 第一届载歌在谷音乐节</span></div>
        <h1 class="mf-home-title">逆向悬浮</h1>
        <div class="mf-home-subtitle">DEFYING GRAVITY</div>
        <p class="mf-home-desc" style="color: rgba(255, 255, 255, 0.85);">
          世俗向前，我们逆向；万物沉落，我们悬浮。湾区华人乐迷自己的户外舞台，10 月 25 日不见不散！
        </p>
        <div class="mf-home-facts">
          <div class="mf-home-fact">
            <span class="mf-home-fact-label">演出日期</span>
            <span class="mf-home-fact-value">10/25（周日）<br>12:00 - 18:00</span>
          </div>
          <div class="mf-home-fact">
            <span class="mf-home-fact-label">演出地点</span>
            <span class="mf-home-fact-value">Leo J Ryan Park<br>650 Shell Blvd, Foster City</span>
          </div>
        </div>
        <div class="mf-home-ctas">
          <a class="mf-home-cta" href="#mf-tickets" data-mf-flip="open">立即购票</a>
          <a class="mf-home-cta mf-home-cta-ghost" href="{{ '/music-festival/' | relative_url }}">了解音乐节 →</a>
        </div>
      </div>
      <div class="col-md-5 text-center mf-home-poster-col">
        <div class="mf-flip" id="mf-flip">
          <div class="mf-flip-inner">
            <div class="mf-flip-face mf-flip-front">
              <a href="{{ '/music-festival/' | relative_url }}">
                <img class="mf-home-poster"
                     src="{{ '/images/2026-music-festival/band-poster.jpg' | relative_url }}"
                     alt="载歌在谷第一届音乐节《逆向悬浮 Defying Gravity》海报">
              </a>
            </div>
            <div class="mf-flip-face mf-flip-back" id="mf-tickets" aria-hidden="true">
              <div class="mf-tickets-head">
                <h2 class="mf-home-tickets-title">购票 · Tickets</h2>
                <button type="button" class="mf-flip-back-btn" data-mf-flip="close">← 看海报</button>
              </div>
              <div id="eventbrite-widget-container-2001158142875"></div>
              <p class="mf-home-tickets-fallback">
                购票窗口没有出现？请
                <a href="https://zgzg.li/mf-2026" target="_blank" rel="noopener noreferrer">在 Eventbrite 上购票</a>。
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.eventbrite.com/static/widgets/eb_widgets.js"></script>
<script>
  window.EBWidgets && window.EBWidgets.createWidget({
    widgetType: 'checkout',
    eventId: '2001158142875',
    iframeContainerId: 'eventbrite-widget-container-2001158142875',
    iframeContainerHeight: window.innerWidth < 768 ? 430 : 520
  });
</script>
<script>
  (function () {
    var card = document.getElementById('mf-flip');
    if (!card) return;
    var back = document.getElementById('mf-tickets');
    function setFlipped(flipped) {
      card.classList.toggle('is-flipped', flipped);
      back.setAttribute('aria-hidden', flipped ? 'false' : 'true');
      if (flipped) {
        var r = card.getBoundingClientRect();
        if (r.top < 0 || r.bottom > window.innerHeight) {
          card.scrollIntoView({behavior: 'smooth', block: 'center'});
        }
      }
    }
    document.querySelectorAll('[data-mf-flip]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.preventDefault();
        setFlipped(el.getAttribute('data-mf-flip') === 'open');
      });
    });
    if (location.hash === '#mf-tickets') setFlipped(true);
  })();
</script>
