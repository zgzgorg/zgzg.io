{%- comment -%} gala 页面的样式，中文 _layouts/gala.html 和英文 pages/en/gala.html 共用 {%- endcomment -%}
<style>
    /* ===== 春晚红金风格基础色 ===== */
    :root {
        --gala-red: #b30000;
        --gala-gold: #ffd700;
        --gala-bg-light: #fff9f2;
    }

    body {
        background-color: var(--gala-bg-light);
    }

    /* ===== 标题与文字 ===== */
    h1, h2, h3 {
        color: var(--gala-red);
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .underline {
        position: relative;
        display: inline-block;
    }

    .underline::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 50%;
        width: 80px;
        height: 4px;
        background: linear-gradient(90deg, var(--gala-gold), var(--gala-red));
        transform: translateX(-50%);
        border-radius: 4px;
    }

    .custom-text-style {
        font-size: 1.1rem;
        color: #333;
    }

    /* ===== 按钮样式 ===== */
    .btn-bg-darkened {
        background: linear-gradient(90deg, var(--gala-red), #800000);
        color: var(--gala-gold);
        font-weight: 600;
        border: none;
        transition: all 0.3s ease;
    }

    .btn-bg-darkened:hover {
        background: linear-gradient(90deg, #800000, var(--gala-red));
        color: #fff;
        transform: scale(1.05);
        box-shadow: 0 0 10px rgba(255,215,0,0.5);
    }

    /* ===== 卡片样式 ===== */
    .card {
        background: #fff;
        border: 2px solid rgba(255,215,0,0.3);
        transition: all 0.3s ease;
    }

    .card:hover {
        transform: translateY(-6px) scale(1.02);
        box-shadow: 0 6px 20px rgba(179, 0, 0, 0.2);
        border-color: var(--gala-gold);
    }

    .card-body p {
        margin: 0;
        color: #444;
    }

    .ticket-btn {
        background: linear-gradient(135deg, #c62828, #e53935);
        color: #fff;
        font-weight: 600;
        padding: 10px 26px;
        border-radius: 999px;
        box-shadow: 0 6px 16px rgba(198, 40, 40, 0.35);
        border: none;
        transition: all 0.25s ease;
        text-decoration: none;
        display: inline-block;
    }

    .ticket-btn:hover {
        background: linear-gradient(135deg, #b71c1c, #d32f2f);
        box-shadow: 0 10px 22px rgba(183, 28, 28, 0.45);
        transform: translateY(-2px);
        color: #fff;
    }

    /* ===== 购票按钮区与下方红线的视觉间距 ===== */
    .ticket-action {
        margin-bottom: 3.5rem; /* 关键：拉开与 about-gala 顶部红线的距离 */
    }

    /* ===== 购票 FAQ 样式 ===== */
    .ticket-faq {
        margin-top: 1.5rem;
        padding-left: 1rem;
        border-left: 3px solid var(--gala-gold);
    }

    .ticket-faq p {
        margin-bottom: 0.6rem;
        font-size: 0.95rem;
        color: #555;
        line-height: 1.6;
    }

    /* ===== 动画效果 ===== */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .fade-in {
        animation: fadeInUp 0.8s ease forwards;
        opacity: 0;
    }

    /* 延迟动画顺序 */
    .fade-in:nth-child(1) { animation-delay: 0.1s; }
    .fade-in:nth-child(2) { animation-delay: 0.2s; }
    .fade-in:nth-child(3) { animation-delay: 0.3s; }
    .fade-in:nth-child(4) { animation-delay: 0.4s; }

    /* ===== 区块背景 ===== */
    #about-gala, #gala-audition {
        background: linear-gradient(to bottom right, #fff7f7, #fff2e6);
        border-top: 4px solid var(--gala-red);
        border-bottom: 4px solid var(--gala-red);
    }

    /* ===== 小屏优化 ===== */
    @media (max-width: 768px) {
        h1, h2, h3 { font-size: 1.3rem; }
        .custom-text-style { font-size: 1rem; }
    }

    /* ===== 主持人展示模块 ===== */
    .host-card {
        border: 2px solid rgba(255,215,0,0.25);
        background: #fff;
        transition: all 0.35s ease;
        max-width: 420px;
        margin-left: auto;
        margin-right: auto;
    }

    .host-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 28px rgba(179, 0, 0, 0.25);
        border-color: var(--gala-gold);
    }

    /* 头像容器 */
    .host-img-wrapper {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(135deg, var(--gala-gold), var(--gala-red));
    }

    /* 头像本身 */
    .host-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        background: #fff;
        object-fit: cover;
        object-position: center top;
    }

    /* 名字 */
    .host-name {
        color: var(--gala-red);
        font-weight: 700;
        letter-spacing: 1px;
    }

    /* 简介 */
    .host-desc {
        font-size: 0.95rem;
        color: #555;
        line-height: 1.6;
        padding: 0 0.5rem;
        white-space: pre-line;
        text-align: justify;
        text-align-last: left;
        margin-bottom: 0.25rem;
    }

    .host-highlights ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .host-highlights li {
        position: relative;
        padding-left: 1.2rem;   /* 文本统一起点 */
        font-size: 0.9rem;
        color: #555;
        line-height: 1.5;
        margin-bottom: 0.35rem;
        text-align: left;
    }

    .host-highlights li::before {
        content: "•";
        position: absolute;
        left: 0;
        top: 0.2em;             /* 微调垂直位置 */
        color: var(--gala-red); /* 或金色 */
        font-size: 1rem;
    }

    .program-card { @extend .host-card; }   /* 如果你不用 SCSS，就直接复制 */
    .program-img-wrapper {
        width: 100%;
        aspect-ratio: 4 / 5;     /* 你也可以 1 / 1 */
        background: #f7f7f7;     /* 兜底背景 */
        border-radius: 12px;
        overflow: hidden;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .program-img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;    /* 👈 关键 */
    }

    .program-name {
        font-weight: 600;
        color: var(--gala-red);
        margin-bottom: 0.4rem;
    }

    .program-desc {
        font-size: 0.9rem;
        color: #555;
        line-height: 1.6;
        text-align: justify;
        text-align-last: left;
        margin-bottom: 0;
        white-space: pre-line;
    }

    .program-desc-text {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #555;

        display: -webkit-box;
        -webkit-line-clamp: 10;     /* 显示行数 */
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .program-desc.expanded .program-desc-text {
        -webkit-line-clamp: unset;
    }

    .program-desc-toggle {
        background: none;
        border: none;
        padding: 0;
        margin-top: 0.25rem;

        font-size: 0.85rem;
        color: #c33;
        cursor: pointer;
    }

    .gala-section-title {
        color: var(--gala-red);
        font-weight: 700;
        margin-bottom: 1rem;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

    .event-info-line {
        font-size: 0.95rem;
        color: #555;
        line-height: 1.6;
        margin-bottom: 0.5rem;
        }

    .ticket-action .ticket-btn {
        min-width: 160px;
    }

    .ticket-faq p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #555;
        margin-bottom: 0.4rem;
    }

    @media (max-width: 767.98px) {
        .gala-section-title {
            font-size: 1.4rem;
            text-align: center;
        }

        .event-info-line {
            font-size: 0.9rem;
            text-align: center; /* 手机上居中，更易读 */
        }

        .ticket-action {
            text-align: center;
            margin-top: 1rem;
        }

        .ticket-btn {
            width: 70%;
            max-width: 220px;
        }

        .ticket-faq p {
            text-align: center;
        }
    }

</style>
