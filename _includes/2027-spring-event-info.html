{%- comment -%} 文字在 _data/i18n/*.yml 的 gala_2027 一节 {%- endcomment -%}
<div class="container">
  <div class="home-section-header">
    <div class="home-section-content_top">

      <div class="row">
        <div class="col-12 text-start">

          <h1 class="gala-hero-title cny-2027-event-title mb-2">
            {{ t.gala_2027.title }}
          </h1>

          <h4 class="gala-hero-subtitle mb-4">
            {{ t.gala_2027.subtitle }}
          </h4>

          <div class="gala-info">
            {%- for line in t.gala_2027.lines %}
            <p class="gala-info-line">
              {{ line }}
            </p>
            {%- endfor %}
            <p class="gala-info-line text-muted small">
              {{ t.gala_2027.note }}
            </p>
            <p class="gala-info-line">
              {{ t.gala_2027.show }}
            </p>
          </div>

          <div class="mt-4">
            <a class="ticket-btn btn btn-lg px-4 py-3"
               href="https://d.zgzg.io/2027cnyg/signup"
               target="_blank"
               rel="noopener noreferrer">
              {{ t.gala_2027.button }}
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
