# 页脚的社交媒体图标（_includes/footer.html）。
# primary：最主要的三个平台，单独一行，图标大一些；others：其余平台，排在下一行。
# 下面 events 一组是活动报名平台。
# 带 qr 的是国内平台，点图标弹出二维码；qr 是二维码里存的地址，二维码图片在
#   images/social/qr/<key>.webp，由 tools/social-qr.py 生成；url 是浏览器不支持
#   弹窗时的后备链接。
# 不带 qr 的是海外平台，点图标直接打开 url。
# name_en 是英文页显示的平台名；没有 name_en 的平台中英文同名。
primary:
  - { key: wechat, name: 微信公众号, name_en: "WeChat", icon: wechat.svg, qr: "http://weixin.qq.com/r/uXQXD9bEdIsLrZJs9yGr", url: "https://mp.weixin.qq.com/s/MQrUzT-XkxsRdRQQRpb4Fw" }
  - { key: xhs, name: 小红书, name_en: "Xiaohongshu (RED)", icon: xhs.svg, qr: "https://www.xiaohongshu.com/user/profile/6056e0a4000000000100180a", url: "https://www.xiaohongshu.com/user/profile/6056e0a4000000000100180a" }
  - { name: YouTube, icon: youtube.svg, url: "https://www.youtube.com/@ZGZG" }
# events：活动报名平台，header 里排在主要平台后面，页脚排在第二行开头。
