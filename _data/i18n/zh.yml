  about_heading: 关于 "载歌在谷"
  about_body: >-
    <p>载歌在谷社区是一个以硅谷高科技华人从业者为主要贡献者，以文艺文化活动为载体，旨在促进贡献者的快乐、友谊和成长的社区。</p>
    <p>源自2015年的谷歌内部春晚，"载歌在谷"社区于2017年起走出谷歌、成为面向整个硅谷和旧金山湾区的独立的非盈利社区。</p>
