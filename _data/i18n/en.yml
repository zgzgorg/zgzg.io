    <p>ZaiGeZaiGu (载歌在谷) is a community of volunteers, most of them Chinese professionals in Silicon Valley tech. We use arts and cultural events to bring joy, friendship and growth to everyone who takes part.</p>
    <p>ZaiGeZaiGu started in 2015 as the Lunar New Year Gala inside Google. In 2017 it became an independent nonprofit community open to all of Silicon Valley and the San Francisco Bay Area.</p>
